spring.application.name=cine-reserve

spring.config.import=optional:file:./src/main/resources/local-secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/cine_reserve
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true